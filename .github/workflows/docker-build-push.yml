name: Publish Tactical Docker Images
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image:
          - tactical
          - tactical-meshcentral
          - tactical-nats
          - tactical-frontend
          - tactical-nginx
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Get image tags
        id: prep
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="$(grep '^TRMM_VERSION' api/tacticalrmm/tacticalrmm/settings.py | cut -d'"' -f 2)"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "repo=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          pull: true
          file: ./docker/containers/${{ matrix.image }}/dockerfile
          platforms: linux/amd64
          tags: ${{ steps.prep.outputs.repo }}/${{ matrix.image }}:${{ steps.prep.outputs.version }},${{ steps.prep.outputs.repo }}/${{ matrix.image }}:latest
